<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>1200 in 1 (NES Retro Collection)</title>
  <meta name="description" content="Play 1200 in 1 NES retro classic collection directly in your web browser on your laptop or PC." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css" />
</head>

<body>
  <!-- Full Screen Game Viewport -->
  <div id="game-viewport">
    <div id="game"></div>

    <!-- On-Screen Virtual Touch Controller for Mobile -->
    <div id="touch-controls" class="touch-controls">
      <!-- Left D-Pad -->
      <div class="dpad-container" id="touch-dpad">
        <button class="dpad-btn dpad-up" data-btn="up" aria-label="Up">▲</button>
        <button class="dpad-btn dpad-left" data-btn="left" aria-label="Left">◀</button>
        <div class="dpad-center"></div>
        <button class="dpad-btn dpad-right" data-btn="right" aria-label="Right">▶</button>
        <button class="dpad-btn dpad-down" data-btn="down" aria-label="Down">▼</button>
      </div>

      <!-- Center Start / Select Buttons -->
      <div class="meta-container">
        <button class="meta-btn" data-btn="select" id="btn-touch-select" aria-label="Select">SELECT</button>
        <button class="meta-btn" data-btn="start" id="btn-touch-start" aria-label="Start">START</button>
      </div>

      <!-- Right Action Buttons (SNES: Y, X, B, A; NES: B, A) -->
      <div class="action-container" id="touch-actions">
        <div class="action-row action-row-top">
          <button class="action-btn action-x snes-btn" data-btn="x" aria-label="X button">X</button>
        </div>
        <div class="action-row action-row-mid">
          <button class="action-btn action-y snes-btn" data-btn="y" aria-label="Y button">Y</button>
          <button class="action-btn action-a" data-btn="a" aria-label="A button">A</button>
        </div>
        <div class="action-row action-row-bot">
          <button class="action-btn action-b" data-btn="b" aria-label="B button">B</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Startup Controller Selection Modal -->
  <div id="startup-modal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-badge">RETRO ARCADE (NES & SNES)</div>
      <h1 class="modal-title">RETRO COLLECTION</h1>
      <p class="modal-subtitle">PLAY DIRECTLY IN BROWSER ON LAPTOP / PC / MOBILE</p>

      <!-- Game Selection Section -->
      <div class="rom-selection-section">
        <label for="rom-select" class="rom-label">SELECT GAME</label>
        <div class="select-wrapper">
          <select id="rom-select" class="rom-select" aria-label="Select NES Game">
            <!-- Populated dynamically via main.js -->
          </select>
        </div>
        <div class="custom-rom-wrapper">
          <label for="rom-file-input" class="btn-custom-rom">
            📁 Load Custom ROM (.nes, .sfc, .smc)
          </label>
          <input type="file" id="rom-file-input" accept=".nes,.sfc,.smc" style="display: none;" />
          <span id="custom-rom-name" class="custom-rom-name"></span>
        </div>
      </div>

      <div class="controller-options" id="controller-options">
        <!-- Option 1: Keyboard (Laptop / PC) -->
        <button class="option-card active" id="opt-keyboard" data-mode="keyboard" type="button" tabindex="0">
          <div class="option-icon">💻</div>
          <div class="option-info">
            <div class="option-title">Laptop / PC Keyboard</div>
            <div class="option-desc">P1: WASD / Space, X (A) &bull; Z (B) &bull; Enter &bull; P2: IJKL / U, O</div>
          </div>
          <div class="option-tag">Recommended</div>
        </button>

        <!-- Option 2: TV Remote -->
        <button class="option-card" id="opt-tv-remote" data-mode="tv" type="button" tabindex="0">
          <div class="option-icon">📺</div>
          <div class="option-info">
            <div class="option-title">TV Remote D-Pad</div>
            <div class="option-desc">D-Pad to Move &bull; OK/Enter to Jump &bull; Play/Color/0 to Run</div>
          </div>
          <div class="option-tag">TV Mode</div>
        </button>
      </div>

      <div class="modal-footer">
        <button class="btn-play-now" id="btn-start" type="button">
          ▶ LAUNCH GAME
        </button>
        <div class="modal-hint">Press <kbd>Enter</kbd> to launch &bull; Tap buttons on mobile</div>
      </div>
    </div>
  </div>

  <!-- In-Game Floating Switch Game Button -->
  <button id="btn-switch-game" class="btn-switch-game" aria-label="Switch Game" title="Switch Game">
    🎮 SWITCH GAME
  </button>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
